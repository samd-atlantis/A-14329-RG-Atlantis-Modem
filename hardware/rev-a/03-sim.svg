<text class="small" x="30" y="590">Do not connect physical SIM and eUICC directly in parallel. Prevent unpowered-branch back-powering.</text>
<text class="small" x="30" y="614">TXS02326A is only a candidate architecture; its internal LDO/interface must be reconciled with modem SIM power.</text>
<text class="small" x="30" y="638">Exact Quectel firmware, SIM voltages, selector control and profile provisioning remain release gates.</text>
<text class="small" x="30" y="662">Selection gives one active subscription; eSIM multi-profile management is a separate software/provider function.</text>
<text class="small" x="30" y="686">No symbol pin numbers are implied by this functional drawing.</text>
<text x="30" y="738" font-size="13">Walchem gateway | 120 VAC | EG25-GL | 4 LAN | Wi-Fi + BLE retained | LoRa omitted | 2026-10-27</text></svg>