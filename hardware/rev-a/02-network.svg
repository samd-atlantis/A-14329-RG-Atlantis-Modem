<text class="small" x="30" y="590">Native router Wi-Fi is the candidate IP path for controllers; Ai-WB2-13 retains BLE / Wi-Fi provisioning.</text>
<text class="small" x="30" y="614">UART transparent data is not an automatic IP bridge. Wi-Fi topology and firmware must be demonstrated.</text>
<text class="small" x="30" y="638">Separate UART service console required; pin mux and logic levels remain unresolved.</text>
<text class="small" x="30" y="662">USB: short 90-ohm differential layout target; PHY guidance and exact modem connector pinout control final design.</text>
<text class="small" x="30" y="686">No LoRa device or antenna is included. Wi-Fi/Bluetooth are explicitly retained.</text>
<text x="30" y="738" font-size="13">Walchem gateway | 120 VAC | EG25-GL | 4 LAN | Wi-Fi + BLE retained | LoRa omitted | 2026-10-27</text></svg>