name: Firmware source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provisioning and carrier-control tests
        run: python3 -m unittest discover -s firmware/tests -p 'test_*.py' -v
      - name: LuCI source and access-control checks
        run: node firmware/tests/check.js
      - name: Shell syntax
        run: |
          bash -n firmware/build.sh
          find firmware/package/atech-gateway/files -type f | while read -r f; do
            if head -n 1 "$f" | grep -q '^#!/bin/sh'; then sh -n "$f"; fi
          done
